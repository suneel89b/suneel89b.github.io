<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Illustration of a chat conversation next to a balanced meal plate</title>
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#17304A"/>
      <stop offset="1" stop-color="#0F1A2B"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#9AA7BB" fill-opacity=".16"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="plateClip"><circle cx="1110" cy="460" r="250"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- chat window -->
  <g filter="url(#sh)">
    <rect x="150" y="150" width="560" height="600" rx="28" fill="#1E2A44" stroke="#5EEAD4" stroke-opacity=".35" stroke-width="2"/>
  </g>
  <rect x="150" y="150" width="560" height="74" rx="28" fill="#162238"/>
  <rect x="150" y="196" width="560" height="28" fill="#162238"/>
  <circle cx="200" cy="187" r="9" fill="#5EEAD4"/>
  <rect x="222" y="180" width="170" height="14" rx="7" fill="#E6ECF5" fill-opacity=".85"/>

  <!-- bot bubble 1 -->
  <circle cx="208" cy="282" r="24" fill="#2DD4BF"/>
  <path d="M199 282c4-12 14-12 18 0" stroke="#0F1A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="248" y="258" width="380" height="80" rx="18" fill="#2B3A5A"/>
  <rect x="272" y="280" width="300" height="12" rx="6" fill="#E6ECF5" fill-opacity=".9"/>
  <rect x="272" y="304" width="220" height="12" rx="6" fill="#E6ECF5" fill-opacity=".55"/>

  <!-- user bubble -->
  <rect x="322" y="372" width="340" height="62" rx="18" fill="#0F766E"/>
  <rect x="346" y="394" width="260" height="12" rx="6" fill="#ECFDF9" fill-opacity=".95"/>

  <!-- bot bubble 2 with checklist -->
  <circle cx="208" cy="498" r="24" fill="#2DD4BF"/>
  <path d="M199 498c4-12 14-12 18 0" stroke="#0F1A2B" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="248" y="470" width="400" height="170" rx="18" fill="#2B3A5A"/>
  <g fill="none" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 505l8 8 14-16"/><path d="M274 553l8 8 14-16"/><path d="M274 601l8 8 14-16"/>
  </g>
  <rect x="314" y="499" width="280" height="12" rx="6" fill="#E6ECF5" fill-opacity=".85"/>
  <rect x="314" y="547" width="230" height="12" rx="6" fill="#E6ECF5" fill-opacity=".85"/>
  <rect x="314" y="595" width="260" height="12" rx="6" fill="#E6ECF5" fill-opacity=".85"/>

  <!-- input bar -->
  <rect x="178" y="676" width="504" height="46" rx="23" fill="#162238" stroke="#9AA7BB" stroke-opacity=".3"/>
  <rect x="204" y="694" width="150" height="10" rx="5" fill="#9AA7BB" fill-opacity=".45"/>

  <!-- connector dots -->
  <g fill="#5EEAD4"><circle cx="760" cy="460" r="6" fill-opacity=".4"/><circle cx="790" cy="460" r="6" fill-opacity=".65"/><circle cx="820" cy="460" r="6"/></g>

  <!-- plate -->
  <g filter="url(#sh)"><circle cx="1110" cy="460" r="300" fill="#E9EEF4"/></g>
  <circle cx="1110" cy="460" r="268" fill="#FFFFFF"/>
  <g clip-path="url(#plateClip)">
    <!-- half: vegetables & fruit (left) -->
    <rect x="860" y="210" width="250" height="500" fill="#CDEFD9"/>
    <!-- quarter: protein (top right) -->
    <rect x="1110" y="210" width="250" height="250" fill="#F6D9C4"/>
    <!-- quarter: grains (bottom right) -->
    <rect x="1110" y="460" width="250" height="250" fill="#F3E7B8"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="10"><line x1="1110" y1="205" x2="1110" y2="715"/><line x1="1110" y1="460" x2="1365" y2="460"/></g>

  <!-- veg: leaf + carrot + apple -->
  <g transform="translate(985 340)">
    <path d="M0 40C0 0 40-20 80-20 80 20 50 60 0 40Z" fill="#22A06B"/>
    <path d="M6 36L66-8" stroke="#137A4F" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(960 470) rotate(-30)">
    <path d="M0 0L80 18 0 36Z" fill="#F08A3C" stroke="#D96E22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-4 18l-18-14M-4 18l-22 4M-4 18l-16 18" stroke="#22A06B" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(1010 590)">
    <circle cx="0" cy="0" r="36" fill="#E5484D"/>
    <path d="M0-34c2-12 8-18 16-20" stroke="#6B4423" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M6-40c10-10 24-8 28 0-10 8-22 8-28 0Z" fill="#22A06B"/>
  </g>

  <!-- protein: egg -->
  <g transform="translate(1235 340)">
    <ellipse cx="0" cy="0" rx="62" ry="50" fill="#FFFFFF" stroke="#E9DCCF" stroke-width="3"/>
    <circle cx="6" cy="4" r="24" fill="#F5B524"/>
  </g>

  <!-- grains: wheat stalk -->
  <g transform="translate(1230 600)" fill="#C9962B">
    <path d="M0 50L0-60" stroke="#B07F1E" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-14" cy="-40" rx="10" ry="18" transform="rotate(-25 -14 -40)"/><ellipse cx="14" cy="-40" rx="10" ry="18" transform="rotate(25 14 -40)"/>
    <ellipse cx="-14" cy="-10" rx="10" ry="18" transform="rotate(-25 -14 -10)"/><ellipse cx="14" cy="-10" rx="10" ry="18" transform="rotate(25 14 -10)"/>
    <ellipse cx="-14" cy="20" rx="10" ry="18" transform="rotate(-25 -14 20)"/><ellipse cx="14" cy="20" rx="10" ry="18" transform="rotate(25 14 20)"/>
    <ellipse cx="0" cy="-66" rx="9" ry="16"/>
  </g>

  <!-- sparkle (AI) -->
  <g transform="translate(1400 175)" fill="#5EEAD4">
    <path d="M0-34C4-8 8-4 34 0 8 4 4 8 0 34-4 8-8 4-34 0-8-4-4-8 0-34Z"/>
    <path transform="translate(44 52) scale(.45)" d="M0-34C4-8 8-4 34 0 8 4 4 8 0 34-4 8-8 4-34 0-8-4-4-8 0-34Z" fill-opacity=".7"/>
  </g>
</svg>
