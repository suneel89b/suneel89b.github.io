<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Illustration comparing a regression line over house data with a layered neural network reading a satellite image</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%"><stop offset="0" stop-color="#17304A"/><stop offset="1" stop-color="#0F1A2B"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#9AA7BB" fill-opacity=".14"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- LEFT: machine learning — table + regression -->
  <g filter="url(#sh)"><rect x="110" y="170" width="620" height="560" rx="26" fill="#1E2A44" stroke="#9AA7BB" stroke-opacity=".25" stroke-width="2"/></g>
  <!-- house icon -->
  <g transform="translate(170 225)" fill="none" stroke="#E6ECF5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 40 L40 6 L80 40"/><path d="M12 32 V74 H68 V32"/><path d="M32 74 V52 H48 V74"/>
  </g>
  <!-- feature rows -->
  <g fill="#E6ECF5">
    <rect x="280" y="232" width="150" height="12" rx="6" fill-opacity=".85"/><rect x="450" y="232" width="70" height="12" rx="6" fill="#5EEAD4"/>
    <rect x="280" y="262" width="120" height="12" rx="6" fill-opacity=".55"/><rect x="450" y="262" width="90" height="12" rx="6" fill="#5EEAD4" fill-opacity=".7"/>
    <rect x="280" y="292" width="140" height="12" rx="6" fill-opacity=".55"/><rect x="450" y="292" width="55" height="12" rx="6" fill="#5EEAD4" fill-opacity=".5"/>
  </g>
  <!-- axes + scatter + line -->
  <g stroke="#9AA7BB" stroke-opacity=".5" stroke-width="3"><line x1="180" y1="660" x2="670" y2="660"/><line x1="180" y1="660" x2="180" y2="370"/></g>
  <g fill="#E6ECF5" fill-opacity=".85">
    <circle cx="220" cy="620" r="9"/><circle cx="262" cy="598" r="9"/><circle cx="300" cy="610" r="9"/><circle cx="340" cy="566" r="9"/>
    <circle cx="384" cy="560" r="9"/><circle cx="420" cy="522" r="9"/><circle cx="462" cy="530" r="9"/><circle cx="504" cy="486" r="9"/>
    <circle cx="548" cy="470" r="9"/><circle cx="590" cy="440" r="9"/><circle cx="630" cy="418" r="9"/>
  </g>
  <line x1="200" y1="640" x2="660" y2="405" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round"/>

  <!-- VS -->
  <circle cx="800" cy="450" r="48" fill="#0F1A2B" stroke="#5EEAD4" stroke-opacity=".6" stroke-width="2"/>
  <text x="800" y="466" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="40" font-weight="600" fill="#E6ECF5">vs</text>

  <!-- RIGHT: deep learning — satellite tile + layers -->
  <g filter="url(#sh)"><rect x="870" y="170" width="620" height="560" rx="26" fill="#1E2A44" stroke="#9AA7BB" stroke-opacity=".25" stroke-width="2"/></g>
  <!-- satellite image tile -->
  <g transform="translate(920 300)">
    <rect width="200" height="200" rx="10" fill="#2F6B4F"/>
    <path d="M0 120 C50 100 80 140 130 118 S200 96 200 96 V200 H0 Z" fill="#2B6CB0"/>
    <rect x="120" y="18" width="62" height="54" rx="4" fill="#C9C3B6"/><rect x="132" y="28" width="16" height="14" fill="#8C857A"/><rect x="156" y="44" width="18" height="16" fill="#8C857A"/>
    <path d="M18 24 L96 24 L96 86 L18 86Z" fill="#D9B95B" fill-opacity=".85"/>
    <g stroke="#E6ECF5" stroke-opacity=".25"><path d="M50 0V200M100 0V200M150 0V200M0 50H200M0 100H200M0 150H200"/></g>
    <rect width="200" height="200" rx="10" fill="none" stroke="#5EEAD4" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- layers -->
  <g stroke="#9AA7BB" stroke-opacity=".28" stroke-width="2">
    <path d="M1180 330L1270 300M1180 330L1270 400M1180 330L1270 500M1180 400L1270 300M1180 400L1270 400M1180 400L1270 500M1180 470L1270 300M1180 470L1270 400M1180 470L1270 500"/>
    <path d="M1270 300L1360 350M1270 300L1360 450M1270 400L1360 350M1270 400L1360 450M1270 500L1360 350M1270 500L1360 450"/>
    <path d="M1360 350L1430 400M1360 450L1430 400"/>
  </g>
  <path d="M1128 400 H1166" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round"/>
  <g fill="#5EEAD4">
    <circle cx="1180" cy="330" r="11" fill-opacity=".55"/><circle cx="1180" cy="400" r="11" fill-opacity=".55"/><circle cx="1180" cy="470" r="11" fill-opacity=".55"/>
    <circle cx="1270" cy="300" r="11" fill-opacity=".8"/><circle cx="1270" cy="400" r="11" fill-opacity=".8"/><circle cx="1270" cy="500" r="11" fill-opacity=".8"/>
    <circle cx="1360" cy="350" r="11"/><circle cx="1360" cy="450" r="11"/>
    <circle cx="1430" cy="400" r="14" fill="#2DD4BF"/>
  </g>
  <!-- output label chips -->
  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="24" fill="#0F1A2B">
    <rect x="920" y="560" width="120" height="42" rx="21" fill="#5EEAD4"/><text x="980" y="589" text-anchor="middle">water</text>
    <rect x="1056" y="560" width="120" height="42" rx="21" fill="#9AE6B4"/><text x="1116" y="589" text-anchor="middle">trees</text>
    <rect x="1192" y="560" width="120" height="42" rx="21" fill="#E6ECF5"/><text x="1252" y="589" text-anchor="middle">built</text>
    <rect x="1328" y="560" width="120" height="42" rx="21" fill="#F3E7B8"/><text x="1388" y="589" text-anchor="middle">crops</text>
  </g>
</svg>
