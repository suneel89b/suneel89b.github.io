<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Illustration of a satellite image passing through layers of a neural network to a labeled answer</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%"><stop offset="0" stop-color="#17304A"/><stop offset="1" stop-color="#0F1A2B"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#9AA7BB" fill-opacity=".14"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F3C969"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- input image -->
  <g transform="translate(150 290)">
    <rect width="250" height="250" rx="14" fill="#2F6B4F"/>
    <path d="M0 150 C60 125 100 175 160 150 S250 120 250 120 V250 H0 Z" fill="#2B6CB0"/>
    <rect x="150" y="24" width="76" height="66" rx="5" fill="#C9C3B6"/><rect x="164" y="36" width="20" height="18" fill="#8C857A"/><rect x="194" y="58" width="22" height="20" fill="#8C857A"/>
    <path d="M22 30 L120 30 L120 108 L22 108Z" fill="#D9B95B" fill-opacity=".85"/>
    <g stroke="#E6ECF5" stroke-opacity=".25"><path d="M62 0V250M125 0V250M188 0V250M0 62H250M0 125H250M0 188H250"/></g>
    <rect width="250" height="250" rx="14" fill="none" stroke="#5EEAD4" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <!-- connections -->
  <g stroke="#9AA7BB" stroke-opacity=".28" stroke-width="2">
    <path d="M520 300L720 240M520 300L720 380M520 300L720 520M520 300L720 660M520 415L720 240M520 415L720 380M520 415L720 520M520 415L720 660M520 530L720 240M520 530L720 380M520 530L720 520M520 530L720 660"/>
    <path d="M720 240L920 310M720 240L920 450M720 240L920 590M720 380L920 310M720 380L920 450M720 380L920 590M720 520L920 310M720 520L920 450M720 520L920 590M720 660L920 310M720 660L920 450M720 660L920 590"/>
    <path d="M920 310L1110 360M920 310L1110 540M920 450L1110 360M920 450L1110 540M920 590L1110 360M920 590L1110 540"/>
  </g>
  <path d="M420 415 H500" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>

  <!-- nodes -->
  <g fill="#5EEAD4">
    <circle cx="520" cy="300" r="17" fill-opacity=".55"/><circle cx="520" cy="415" r="17" fill-opacity=".55"/><circle cx="520" cy="530" r="17" fill-opacity=".55"/>
    <circle cx="720" cy="240" r="17" fill-opacity=".75"/><circle cx="720" cy="380" r="17" fill-opacity=".75"/><circle cx="720" cy="520" r="17" fill-opacity=".75"/><circle cx="720" cy="660" r="17" fill-opacity=".75"/>
    <circle cx="920" cy="310" r="17"/><circle cx="920" cy="450" r="17"/><circle cx="920" cy="590" r="17"/>
    <circle cx="1110" cy="360" r="20" fill="#2DD4BF"/><circle cx="1110" cy="540" r="20" fill="#2DD4BF"/>
  </g>

  <!-- output -->
  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="30" fill="#0F1A2B">
    <rect x="1180" y="330" width="250" height="60" rx="30" fill="#5EEAD4"/><text x="1305" y="370" text-anchor="middle">water 80%</text>
    <rect x="1180" y="510" width="250" height="60" rx="30" fill="#E6ECF5"/><text x="1305" y="550" text-anchor="middle">city 20%</text>
  </g>

  <!-- learn-from-mistakes arrow -->
  <path d="M1110 740 C 900 800, 700 800, 520 740" fill="none" stroke="#F3C969" stroke-width="5" stroke-dasharray="14 10" marker-end="url(#ah)"/>
</svg>
